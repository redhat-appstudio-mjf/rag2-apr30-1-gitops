apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: rag2-apr30-1-model-server
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rag2-apr30-1-model-server
    app.kubernetes.io/part-of: rag2-apr30-1
  name: rag2-apr30-1-model-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: rag2-apr30-1-model-server
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: rag2-apr30-1-model-server
    spec:
      initContainers:
        - name: model-file
          image: quay.io/maysunfaisal/granite-3.1-8b-instruct:latest
          command: ['cp', '-R', '/model/granite-3.1-8b-instruct', '/shared/granite-3.1-8b-instruct']
          volumeMounts:
            - name: model-file
              mountPath: /shared
      containers:
        - env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8001"
            - name: MODEL_PATH
              value: /model/granite-3.1-8b-instruct
            - name: CHAT_FORMAT
              value: openchat
          image: quay.io/ai-lab/llamacpp_python:latest
          volumeMounts:
            - name: model-file
              mountPath: /model
          name: app-model-service
          ports:
            - containerPort: 8001
          securityContext:
            runAsNonRoot: true
      volumes:
        - name: model-file
          emptyDir: {}
